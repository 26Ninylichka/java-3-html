<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

<div style="width: 420px; border: 1px solid black; padding: 20px;">
    <h1>Student Registration Form</h1>

    <form action="http://localhost:8080/students/sign-up" method="POST">

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" style="width: 60px;">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <span>Gender:</span>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <span>Interests:</span>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>

        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="reading">Reading</label>
        <br><br>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">United States</option>
            <option value="germany">Germany</option>
            <option value="ukraine">Ukraine</option>
        </select>
        <br><br>

        <label for="bio">Short Bio:</label><br>
        <textarea id="bio" name="bio" rows="5" cols="35"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</div>

</body>

</html>ml>
